---
# tasks file for roles/java

# Necessary for java install on systemd docker images
- name: system packages | Install dirmngr (ubuntu)
  ansible.builtin.apt:
    name:
      - dirmngr
    state: present
    update_cache: yes

# Necessary for java install on systemd docker images
- name: system packages | Ensure the man directory exists
  ansible.builtin.file:
    path: /usr/share/man/man1
    state: directory
    mode: '0755'

- name: system packages | install java jre (ubuntu)
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 86400
    name: >-
      openjdk-{{ java_backwards_compatibility_version.debian[item] |
      default(item) }}-jre
    state: present
  with_items: "{{ java_versions }}"

- name: system packages | install java jdk (ubuntu)
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 86400
    name: >-
      openjdk-{{ java_backwards_compatibility_version.debian[item] |
      default(item) }}-jdk
    state: present
  when: java_jdk_install
  with_items: "{{ java_versions }}"
