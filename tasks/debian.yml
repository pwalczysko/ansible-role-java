---
# tasks file for roles/java

- name: Populate service facts
  ansible.builtin.service_facts:

- name: Print service facts
  ansible.builtin.debug:
    var: ansible_facts.services

- name: show names of existing systemd services, sometimes systemd knows about services that were never installed
  debug: msg={{ existing_systemd_services | map(attribute='name') }}
  vars:
     known_systemd_services: "{{ ansible_facts['services'].values() | selectattr('source', 'equalto', 'systemd') }}"
     existing_systemd_services: "{{ known_systemd_services | rejectattr('state', 'equalto', 'not-found') }}"

# Necessary for java install on systemd docker images
- name: system packages | Install dirmngr (ubuntu)
  ansible.builtin.apt:
    name:
      - dirmngr
    state: present
    update_cache: yes

# Necessary for java install on systemd docker images
- name: system packages | Ensure the man directory exists
  ansible.builtin.file:
    path: /usr/share/man/man1
    state: directory
    mode: '0755'

- name: system packages | install java jre (ubuntu)
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 86400
    name: >-
      openjdk-{{ java_backwards_compatibility_version.debian[item] |
      default(item) }}-jre
    state: present
  with_items: "{{ java_versions }}"

- name: system packages | install java jdk (ubuntu)
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 86400
    name: >-
      openjdk-{{ java_backwards_compatibility_version.debian[item] |
      default(item) }}-jdk
    state: present
  when: java_jdk_install
  with_items: "{{ java_versions }}"
